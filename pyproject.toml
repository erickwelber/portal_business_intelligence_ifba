[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "portal_business_intelligence_ifba"
version = "0.0.1"
description = "Portal de Business Intelligence do Instituto Federal da Bahia - IFBA"
authors = [
  { name = "Erick Cruz" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["portal_business_intelligence_ifba"]
include = ["pyproject.toml", "portal_business_intelligence_ifba/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["portal_business_intelligence_ifba"]
force-sort-within-sections = true

